<article class="work-card" data-tags="{{ include.post.tags | join: ' ' }}">
  <a class="work-card__link" href="{{ include.post.url | relative_url }}" aria-label="{{ include.post.title | escape }}の詳細を見る">
    <div class="work-card__media">
      {% if include.post.thumbnail %}
        <img src="{{ include.post.thumbnail | relative_url }}" alt="{{ include.post.thumbnail_alt | default: include.post.title | escape }}" loading="lazy" decoding="async">
      {% else %}
        <div class="work-card__fallback" aria-hidden="true"></div>
      {% endif %}
    </div>
  </a>
</article>
